name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Production target is PostgreSQL 16 (schema validated on 16.14).
        # Local dev may run newer; CI pins the deployment truth.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bizsuite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: bizsuite
      PGUSER: postgres
      PGPASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Load schema
        run: psql -h localhost -U postgres -d bizsuite -f schema.sql
        env:
          PGPASSWORD: ci

      - name: Integration suite (quote-to-cash spine)
        run: npm run test:integration

      - name: Auth suite
        run: npm run test:auth

      - name: RBAC suite
        run: npm run test:rbac

      - name: Masters suite
        run: npm run test:masters

      - name: Khata rail suite
        run: npm run test:khata

      - name: Concurrency test (parallel submitters, one winner)
        run: npx tsx test/concurrency.ts
